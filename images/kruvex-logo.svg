<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear circle with teeth -->
  <circle cx="200" cy="150" r="95" fill="url(#gearGradient)"/>
  
  <!-- Gear teeth -->
  <rect x="185" y="35" width="30" height="40" rx="8" fill="#3a3a3a"/>
  <rect x="285" y="55" width="40" height="30" rx="8" fill="#3a3a3a" transform="rotate(45 305 70)"/>
  <rect x="295" y="185" width="40" height="30" rx="8" fill="#3a3a3a" transform="rotate(45 315 200)"/>
  <rect x="185" y="265" width="30" height="40" rx="8" fill="#3a3a3a"/>
  <rect x="75" y="185" width="40" height="30" rx="8" fill="#3a3a3a" transform="rotate(45 95 200)"/>
  <rect x="65" y="55" width="40" height="30" rx="8" fill="#3a3a3a" transform="rotate(45 85 70)"/>
  
  <!-- Location pin with arrow (orange) -->
  <g id="pin">
    <!-- Pin shape -->
    <path d="M 200 80 C 175 80 155 100 155 130 C 155 170 200 220 200 220 C 200 220 245 170 245 130 C 245 100 225 80 200 80 Z" fill="#FF6B35"/>
    
    <!-- Arrow cursor inside -->
    <g transform="translate(200, 135)">
      <polygon points="0,-20 15,5 8,5 8,20 -8,20 -8,5 -15,5" fill="white"/>
    </g>
  </g>
  
  <!-- Blue chevrons below -->
  <g id="chevrons" fill="#003D82">
    <path d="M 160 200 L 190 230 L 160 260" stroke="#003D82" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 210 200 L 240 230 L 210 260" stroke="#003D82" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- KRUVEX Text -->
  <text x="440" y="120" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="#003D82">KRUVEX</text>
  
  <!-- Orange accent slash on K -->
  <rect x="395" y="40" width="35" height="95" fill="#FF6B35" transform="rotate(-20 412 87)"/>
</svg>